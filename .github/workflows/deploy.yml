name: 构建并发布

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建 Web 产物
        run: npm run build

      - name: 生成热更新包（latest.json + update.zip）
        run: |
          VER=$(node -p "require('./package.json').version")
          cd dist
          echo "{\"version\":\"$VER\",\"url\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/update.zip\"}" > latest.json
          zip -qr update.zip .

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
